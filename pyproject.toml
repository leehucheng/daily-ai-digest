[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-ai-digest"
version = "0.1.0"
description = "Mobile-first AI news & community consensus daily editorial digest"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
  "certifi>=2024.8.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
